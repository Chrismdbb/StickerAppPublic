<g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#fff">
<text x="16" y="230">Yellow = what you type. Your name will be in place of "Sam".</text>
<text x="16" y="254">Press Enter after each line, and wait until the "PS C:\..." prompt comes back.</text>
